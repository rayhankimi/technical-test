services:
  api:
    build: .
    ports:
      - "8000:8000"   # direct access for curl and Swagger (/docs)

  web:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"     # open http://localhost:8080
    volumes:
      - ./app/fe/public:/usr/share/nginx/html:ro
      - ./app/fe/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy   # waits for the HEALTHCHECK in the Dockerfile

  scheduler:
    build: ./q2
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./q2/snapshots:/data/snapshots
    depends_on:
      api:
        condition: service_healthy
